# 日本株 監視ユニバース ＆ スクリーニング設定ファイル (J-Quants API v2)

[universe]
# 対象とする市場区分
markets = ["プライム"]

# 対象とする規模区分（主力大型株: Core30 + Large70 = 100銘柄）
# ※さらに広げたい場合は "TOPIX Mid400" を配列に追加してください
scale_categories = [
    "TOPIX Core30",
    "TOPIX Large70",
]

# 規模区分に関わらず常時監視に含めたい個別銘柄コード（4桁）
extra_codes = [
    "3197",  # すかいらーくホールディングス（株主優待・スイング）
    "8136",  # サンリオ（株主優待・スイング）
    "1802",  # 大林組
]

# 初回取得時の遡及日数（200日移動平均線を計算できるようデフォルト約2年＝730日）
initial_lookback_days = 730

[screening]
# コア戦略（主力大型株の押し目スイング）抽出閾値
sma_25_dev_min = -6.0   # 25日移動平均線からの乖離率 下限(%)
sma_25_dev_max = 5.0    # 25日移動平均線からの乖離率 上限(%)
rsi_14_min = 30.0       # RSI(14) 下限
rsi_14_max = 65.0       # RSI(14) 上限

# 売買単位・株価上限ルール
max_unit_price_jpy = 5000.0    # 単元株(100株)で買う上限株価（5,000円＝1単元50万円以下は単元株購入）
max_skabu_price_jpy = 25000.0  # 未満株(S株)で買う上限株価（5,001円〜25,000円はS株購入、25,000円超は除外）
