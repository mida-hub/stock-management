# 米国株 監視ユニバース ＆ スクリーニング設定ファイル
# 銘柄を追加・削除したい場合は [[stocks]] ブロックを編集してください。

[screening]
# コア戦略（押し目スイング）候補の抽出閾値
sma_25_dev_min = -6.0   # 25日移動平均線からの乖離率 下限(%)
sma_25_dev_max = 5.0    # 25日移動平均線からの乖離率 上限(%)
rsi_14_min = 30.0       # RSI(14) 下限
rsi_14_max = 65.0       # RSI(14) 上限

